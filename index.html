      /* ========================================================

      :root {

      /* ========================================================

         ======================================================== */
      input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="submit"]):not([type="button"]):not([type="color"]),
      select,
      textarea {
        color: var(--input-foreground);

        opacity: 1;
      }

      /* Native select options contrast */
      select option {
        background-color: var(--surface-elevated);
        color: var(--foreground);
      }

      /* Specific rules for dark mode & dark surfaces */

        body {

      /* Full Screen Premium Gradient Background */
      .premium-bg-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        overflow: hidden;
        /* Requested Palette: Dark Purple -> Violet -> Golden Orange */
        background: linear-gradient(135deg, #3C128D 0%, #8A2CB0 60%, #EEA727 100%);
        background-size: 200% 200%;
        animation: gradientMove 15s ease infinite;
      }

      @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px); /* Soft blur */
        opacity: 0.6;
        animation: floatOrb 20s infinite ease-in-out alternate;
        will-change: transform, opacity;
        mix-blend-mode: screen; /* Helps colors blend luminously */
      }

      /* Dark Purple Blob */
      .orb-1 {
        top: -10%;
        left: -10%;
        width: 60vw;
        height: 60vw;
        background: #3C128D; 
        opacity: 0.7;
      }
      
      /* Violet Purple Blob */
      .orb-2 {
        bottom: -10%;
        right: -10%;
        width: 55vw;
        height: 55vw;
        background: #8A2CB0;
        opacity: 0.6;
        animation-delay: -5s;
      }
      
      /* Golden Orange Blob */
      .orb-3 {
        top: 30%;
        right: 10%;
        width: 40vw;
        height: 40vw;
        background: #EEA727;
        opacity: 0.5;
        animation-delay: -10s;
      }

      /* Light Yellow Highlight/Glow */
      .orb-4 {
        bottom: 20%;
        left: 10%;
        width: 30vw;
        height: 30vw;
        background: #FFF176;
        opacity: 0.4;
        filter: blur(60px);
        animation-delay: -15s;
      }
      
      /* Central subtle pulse */
      .orb-5 {
         top: 50%;
         left: 50%;
         transform: translate(-50%, -50%);
         width: 50vw;
         height: 50vw;
         background: radial-gradient(circle, rgba(255, 241, 118, 0.2) 0%, rgba(138, 44, 176, 0) 70%);
         animation: pulseGlow 8s infinite ease-in-out;
         opacity: 0.5;
      }

      @keyframes floatOrb {
        0% { transform: translate(0, 0) scale(1) rotate(0deg); }
        50% { transform: translate(30px, 40px) scale(1.05) rotate(5deg); }
        100% { transform: translate(-20px, 20px) scale(0.95) rotate(-5deg); }
      }
      
      @keyframes pulseGlow {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
        50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.6; }
      }

      /* High-Contrast Glass Panels for Content */
      .glass-panel {
        background: var(--surface);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        box-shadow:

        color: var(--foreground);
      }

        background: rgba(17, 24, 39, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:

      /* Liquid Glass Buttons */

      /* Accent (Yellow/Gold) Liquid Button */
      .btn-glass-accent {
        background: linear-gradient(135deg, rgba(238, 167, 39, 0.2) 0%, rgba(255, 241, 118, 0.2) 100%);
        color: #92400e; 
        border: 1px solid rgba(238, 167, 39, 0.4);
        box-shadow: 0 4px 12px rgba(238, 167, 39, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      }

      .btn-glass-accent:hover:not(:disabled) {
        background: linear-gradient(135deg, rgba(238, 167, 39, 0.3) 0%, rgba(255, 241, 118, 0.3) 100%);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(238, 167, 39, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        border-color: rgba(238, 167, 39, 0.6);
      }

      .btn-glass:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
        filter: grayscale(0.5);
      }

      /* === Dark Dropdown Styles === */
      .dark-dropdown {
        background-color: rgba(15, 23, 42, 0.85); /* Dark slate background */
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(4px);
      }
      .dark-dropdown:focus {
        border-color: #8A2CB0;
        outline: none;
        box-shadow: 0 0 0 2px rgba(138, 44, 176, 0.3);
      }
      .dark-dropdown option {
        background-color: #0f172a; /* Solid dark background for list items */
        color: white;
      }
      /* Ensure disabled state is visible */
      .dark-dropdown:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        background-color: rgba(15, 23, 42, 0.5);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* === FOOTER ANIMATIONS === */
      .footer-bar {
        width: 100%;
        height: 48px;
        /* Premium Gradient: Purple -> Violet -> Gold -> Dark Slate -> Purple (for loop) */
        background: linear-gradient(270deg, #3C128D, #8A2CB0, #EEA727, #6b21a8, #3C128D);
        background-size: 800% 800%;
        animation: footerGradient 20s ease infinite;
        display: flex;
        align-items: center;
        overflow: hidden;
        position: relative;
        z-index: 50;
        border-top: 1px solid rgba(255,255,255,0.3);
        box-shadow: 0 -4px 30px rgba(0,0,0,0.15);
      }

      @keyframes footerGradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      .marquee-track {
        display: flex;
        white-space: nowrap;
        will-change: transform;
        animation: marqueeScroll 40s linear infinite;
      }
      
      .marquee-item {
        flex-shrink: 0;
        padding: 0 60px;
        color: #ffffff;
        font-weight: 800;
        font-size: 11px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        text-shadow: 0 1px 3px rgba(0,0,0,0.4);
      }

      @keyframes marqueeScroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); } 
      }
      
      /* Pause on hover for better readability */
      .footer-bar:hover .marquee-track {
        animation-play-state: paused;
      }
    </style>
