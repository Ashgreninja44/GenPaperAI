<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE9" />
      <stop offset="100%" stop-color="#E2DDD5" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C57534" />
      <stop offset="40%" stop-color="#B26527" />
      <stop offset="100%" stop-color="#8F4813" />
    </linearGradient>
    
    <!-- Skin Tone Gradients -->
    <radialGradient id="faceBase" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#E5A882" />
      <stop offset="55%" stop-color="#D7946C" />
      <stop offset="85%" stop-color="#C27E55" />
      <stop offset="100%" stop-color="#A5623C" />
    </radialGradient>
    <radialGradient id="foreheadHighlight" cx="50%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ECC0A2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D7946C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cheekLeft" cx="35%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#E89F7D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D7946C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cheekRight" cx="65%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#E89F7D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#D7946C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="neckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C5935" />
      <stop offset="35%" stop-color="#B87349" />
      <stop offset="100%" stop-color="#CD895F" />
    </linearGradient>

    <!-- Hair Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28262C" />
      <stop offset="60%" stop-color="#141316" />
      <stop offset="100%" stop-color="#08070A" />
    </linearGradient>

    <!-- Shirt Gradients -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="collarShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Tie & Lanyard Gradients -->
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#542F1C" />
      <stop offset="50%" stop-color="#412213" />
      <stop offset="100%" stop-color="#2E160A" />
    </linearGradient>
    <linearGradient id="lanyardRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B91C1C" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Glasses Glass Glint -->
    <linearGradient id="glassGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.25" />
    </filter>
    <filter id="chinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#5A2E14" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <!-- Upper Wall -->
  <rect x="0" y="0" width="600" height="370" fill="url(#wallGrad)" />
  <!-- Lower Wood Panel Divider -->
  <rect x="0" y="365" width="600" height="15" fill="#6A320A" />
  <rect x="0" y="380" width="600" height="420" fill="url(#woodGrad)" />
  <!-- Wood grain highlights -->
  <line x1="0" y1="450" x2="600" y2="450" stroke="#7A3B0D" stroke-width="2" opacity="0.4" />
  <line x1="0" y1="560" x2="600" y2="560" stroke="#9E4E16" stroke-width="1.5" opacity="0.3" />
  <line x1="0" y1="670" x2="600" y2="670" stroke="#682F08" stroke-width="2" opacity="0.4" />

  <!-- ================= SHOULDERS & TORSO ================= -->
  <!-- Shirt Body -->
  <path d="M 120 800 C 130 630 180 570 230 550 L 370 550 C 420 570 470 630 480 800 Z" fill="url(#shirtGrad)" filter="url(#softShadow)" />
  
  <!-- Shirt Placket Center Seam & Buttons -->
  <path d="M 292 570 L 308 570 L 308 800 L 292 800 Z" fill="#F1F5F9" />
  <line x1="300" y1="570" x2="300" y2="800" stroke="#CBD5E1" stroke-width="1.5" />
  <!-- Shirt button -->
  <circle cx="300" cy="730" r="5" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
  <circle cx="300" cy="730" r="2" fill="#64748B" />

  <!-- ================= NECK & SHADOW ================= -->
  <path d="M 240 440 L 240 550 C 270 565 330 565 360 550 L 360 440 Z" fill="url(#neckGrad)" />
  <path d="M 240 440 C 270 475 330 475 360 440 C 350 490 250 490 240 440 Z" fill="#753C1B" opacity="0.6" />

  <!-- ================= SHIRT COLLAR ================= -->
  <!-- Left Collar Leaf -->
  <path d="M 230 540 L 195 625 C 235 635 275 605 285 555 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <!-- Right Collar Leaf -->
  <path d="M 370 540 L 405 625 C 365 635 325 605 315 555 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- ================= SCHOOL TIE ================= -->
  <!-- Tie Knot -->
  <polygon points="280,550 320,550 312,590 288,590" fill="url(#tieGrad)" stroke="#1F0F07" stroke-width="1" />
  <!-- Tie Body -->
  <polygon points="288,590 312,590 338,760 300,800 262,760" fill="url(#tieGrad)" stroke="#1F0F07" stroke-width="1" filter="url(#softShadow)" />
  
  <!-- ABPS Crest Emblems on Tie -->
  <!-- Upper crest on knot -->
  <g transform="translate(294, 560) scale(0.6)">
    <path d="M 0 0 L 20 0 L 20 18 C 20 28 10 34 10 34 C 10 34 0 28 0 18 Z" fill="#F59E0B" stroke="#B45309" stroke-width="1" />
    <path d="M 3 3 L 17 3 L 17 16 C 17 24 10 29 10 29 C 10 29 3 24 3 16 Z" fill="#DC2626" />
    <text x="10" y="14" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ABPS</text>
  </g>
  <!-- Lower crest on tie body -->
  <g transform="translate(290, 680) scale(1)">
    <path d="M 0 0 L 20 0 L 20 18 C 20 28 10 34 10 34 C 10 34 0 28 0 18 Z" fill="#F59E0B" stroke="#B45309" stroke-width="1.5" />
    <path d="M 3 3 L 17 3 L 17 16 C 17 24 10 29 10 29 C 10 29 3 24 3 16 Z" fill="#DC2626" />
    <text x="10" y="14" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ABPS</text>
  </g>

  <!-- ================= LANYARDS ================= -->
  <!-- Left Lanyard Strap (hanging over shoulder) -->
  <g>
    <path d="M 210 540 Q 235 660 258 800" stroke="url(#lanyardRed)" stroke-width="26" fill="none" stroke-linecap="square" />
    <path d="M 210 540 Q 235 660 258 800" stroke="#FFFFFF" stroke-width="16" fill="none" />
    <!-- Lanyard Text on Left Ribbon -->
    <path id="leftLanyardPath" d="M 262 800 Q 238 660 213 540" fill="none" stroke="none" />
    <text font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="900" fill="#DC2626" letter-spacing="1">
      <textPath href="#leftLanyardPath" startOffset="10%">
        THE ADITYA BIRLA PUBLIC SCHOOL
      </textPath>
    </text>
  </g>

  <!-- Right Lanyard Strap -->
  <g>
    <path d="M 390 540 Q 365 660 342 800" stroke="url(#lanyardRed)" stroke-width="26" fill="none" stroke-linecap="square" />
    <path d="M 390 540 Q 365 660 342 800" stroke="#FFFFFF" stroke-width="16" fill="none" />
    <!-- Lanyard Text on Right Ribbon -->
    <path id="rightLanyardPath" d="M 387 540 Q 362 660 338 800" fill="none" stroke="none" />
    <text font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="900" fill="#DC2626" letter-spacing="1">
      <textPath href="#rightLanyardPath" startOffset="10%">
        DITYA BIRLA PUBLIC SCHOOL
      </textPath>
    </text>
  </g>

  <!-- ================= HEAD & FACE ================= -->
  <!-- Ears -->
  <g id="ears">
    <!-- Left Ear -->
    <ellipse cx="178" cy="365" rx="18" ry="30" fill="#D7946C" />
    <ellipse cx="180" cy="365" rx="10" ry="18" fill="#B87349" />
    <!-- Right Ear -->
    <ellipse cx="422" cy="365" rx="18" ry="30" fill="#D7946C" />
    <ellipse cx="420" cy="365" rx="10" ry="18" fill="#B87349" />
  </g>

  <!-- Face Shape -->
  <path d="M 185 280 
           C 180 180, 420 180, 415 280 
           C 415 360, 410 430, 360 480 
           C 330 505, 270 505, 240 480 
           C 190 430, 185 360, 185 280 Z" 
        fill="url(#faceBase)" 
        filter="url(#chinShadow)" />

  <!-- Highlights & Cheeks -->
  <ellipse cx="300" cy="270" rx="90" ry="50" fill="url(#foreheadHighlight)" />
  <circle cx="240" cy="390" r="45" fill="url(#cheekLeft)" />
  <circle cx="360" cy="390" r="45" fill="url(#cheekRight)" />

  <!-- Forehead Sacred Tilak / Bindi -->
  <circle cx="300" cy="245" r="4.5" fill="#EA580C" />
  <circle cx="300" cy="245" r="2.5" fill="#EF4444" />

  <!-- Eyebrows -->
  <g fill="#1F2937">
    <!-- Left Eyebrow -->
    <path d="M 215 318 Q 250 305 280 320 Q 250 312 215 318 Z" />
    <!-- Right Eyebrow -->
    <path d="M 385 318 Q 350 305 320 320 Q 350 312 385 318 Z" />
  </g>

  <!-- Eyes & Eye Sockets -->
  <!-- Left Eye -->
  <g id="leftEye">
    <ellipse cx="250" cy="348" rx="20" ry="12" fill="#FFFFFF" />
    <ellipse cx="250" cy="348" rx="10" ry="10" fill="#1C1917" />
    <circle cx="247" cy="345" r="3.5" fill="#000000" />
    <circle cx="245" cy="343" r="2" fill="#FFFFFF" />
    <!-- Upper Eyelid crease -->
    <path d="M 226 344 Q 250 334 274 344" stroke="#8A4A25" stroke-width="2.5" fill="none" />
  </g>
  
  <!-- Right Eye -->
  <g id="rightEye">
    <ellipse cx="350" cy="348" rx="20" ry="12" fill="#FFFFFF" />
    <ellipse cx="350" cy="348" rx="10" ry="10" fill="#1C1917" />
    <circle cx="347" cy="345" r="3.5" fill="#000000" />
    <circle cx="345" cy="343" r="2" fill="#FFFFFF" />
    <!-- Upper Eyelid crease -->
    <path d="M 326 344 Q 350 334 374 344" stroke="#8A4A25" stroke-width="2.5" fill="none" />
  </g>

  <!-- Nose Structure -->
  <g>
    <!-- Nose bridge shadow -->
    <path d="M 294 320 L 290 395 Q 300 412 310 395 L 306 320 Z" fill="#C0774D" opacity="0.4" />
    <!-- Nose Tip & Nostrils -->
    <ellipse cx="300" cy="398" rx="15" ry="8" fill="#DE976F" />
    <ellipse cx="288" cy="402" rx="4" ry="2.5" fill="#884620" />
    <ellipse cx="312" cy="402" rx="4" ry="2.5" fill="#884620" />
    <path d="M 284 402 Q 300 410 316 402" stroke="#B86F45" stroke-width="2" fill="none" />
  </g>

  <!-- Mouth & Lips -->
  <g>
    <!-- Upper Lip -->
    <path d="M 270 445 Q 300 438 330 445 Q 300 448 270 445 Z" fill="#B9674A" />
    <!-- Lip Separator -->
    <path d="M 270 445 Q 300 447 330 445" stroke="#7A361E" stroke-width="2" fill="none" />
    <!-- Lower Lip -->
    <path d="M 274 446 Q 300 464 326 446 Z" fill="#D37E60" />
    <!-- Chin Crease -->
    <path d="M 288 472 Q 300 477 312 472" stroke="#A85B33" stroke-width="2" fill="none" opacity="0.6" />
  </g>

  <!-- ================= EYEGLASSES ================= -->
  <g id="spectacles" filter="url(#softShadow)">
    <!-- Spectacle Frames Bridge -->
    <path d="M 282 336 Q 300 332 318 336" stroke="#0F172A" stroke-width="7" fill="none" stroke-linecap="round" />
    <path d="M 282 336 Q 300 332 318 336" stroke="#475569" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Left Frame Outer Rim -->
    <rect x="204" y="320" width="80" height="58" rx="14" fill="none" stroke="#0F172A" stroke-width="7" />
    <!-- Left Lens Glass Glass with Glint -->
    <rect x="208" y="324" width="72" height="50" rx="10" fill="url(#glassGlint)" />
    <!-- Left Frame Inner Bevel -->
    <rect x="206" y="322" width="76" height="54" rx="12" fill="none" stroke="#334155" stroke-width="1.5" />

    <!-- Right Frame Outer Rim -->
    <rect x="316" y="320" width="80" height="58" rx="14" fill="none" stroke="#0F172A" stroke-width="7" />
    <!-- Right Lens Glass with Glint -->
    <rect x="320" y="324" width="72" height="50" rx="10" fill="url(#glassGlint)" />
    <!-- Right Frame Inner Bevel -->
    <rect x="318" y="322" width="76" height="54" rx="12" fill="none" stroke="#334155" stroke-width="1.5" />

    <!-- Temples / Arms (sides going to ears) -->
    <path d="M 204 335 L 180 348" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />
    <path d="M 396 335 L 420 348" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />
    
    <!-- Metallic hinge accents on frame corners -->
    <circle cx="209" cy="326" r="1.5" fill="#E2E8F0" />
    <circle cx="391" cy="326" r="1.5" fill="#E2E8F0" />
  </g>

  <!-- ================= HAIR ================= -->
  <g id="hair">
    <!-- Hair Base Shell -->
    <path d="M 172 290 
             C 165 170, 220 90, 300 90 
             C 380 90, 435 170, 428 290 
             C 415 230, 400 170, 350 160 
             C 310 150, 290 165, 260 165 
             C 215 165, 190 220, 172 290 Z" 
          fill="url(#hairGrad)" />

    <!-- Hair Strands & Texture -->
    <path d="M 210 180 Q 240 130 280 140" stroke="#374151" stroke-width="3" fill="none" />
    <path d="M 250 150 Q 290 120 330 135" stroke="#374151" stroke-width="3.5" fill="none" />
    <path d="M 300 140 Q 340 125 380 155" stroke="#374151" stroke-width="3" fill="none" />
    <path d="M 185 240 Q 180 180 230 150" stroke="#1F2937" stroke-width="4" fill="none" />
    <path d="M 415 240 Q 420 180 370 150" stroke="#1F2937" stroke-width="4" fill="none" />
    
    <!-- Forehead Hairline Natural Tufts -->
    <path d="M 205 210 C 230 200, 250 205, 275 195 C 295 205, 330 195, 360 205 C 385 215, 395 230, 405 245 C 390 200, 350 175, 300 175 C 250 175, 215 200, 205 210 Z" fill="#18181B" />
  </g>
</svg>
